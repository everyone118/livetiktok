<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Live Plinko - Thả Bóng</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 15%, #1e293b, #0f172a 70%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  #stage { position: relative; width: 600px; height: 800px; }
  canvas {
    display: block;
    border-radius: 14px;
    box-shadow: 0 10px 60px rgba(0, 0, 0, 0.65);
  }
  #hud {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .panel {
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    padding: 6px 12px;
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(3px);
  }
  #score { color: #facc15; }
  #queue { color: #93c5fd; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  #title {
    position: absolute;
    top: 64px; left: 0; right: 0;
    text-align: center;
    color: #fbbf24;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  #reward {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10;
    gap: 8px;
  }
  #reward.hidden { display: none; }
  #reward .fx { line-height: 1; filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.55)); }
  #reward #rewardText {
    color: #fbbf24; font-size: 26px; font-weight: 900;
    letter-spacing: 2px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  }
  #reward .pop { animation: fxPop .35s cubic-bezier(.34, 1.56, .64, 1); }
  #reward .bounce { animation: fxPop .55s cubic-bezier(.34, 1.56, .64, 1) infinite; }
  #reward .shake { animation: fxShake .4s ease-in-out infinite; }
  #reward .dance { animation: fxDance .3s ease-in-out infinite alternate; }
  @keyframes fxPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes fxShake {
    0%, 100% { transform: rotate(-10deg) scale(1); }
    50% { transform: rotate(10deg) scale(1.05); }
  }
  @keyframes fxDance {
    0% { transform: rotate(-10deg) translateY(-8px); }
    100% { transform: rotate(10deg) translateY(8px); }
  }
  #confetti {
    position: absolute; inset: 0; overflow: hidden;
    pointer-events: none; z-index: 9;
  }
  #confetti span {
    position: absolute; top: -16px; width: 9px; height: 15px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(830px) rotate(720deg); } }
  #dancerVideo, #dancerImg { box-shadow: 0 0 40px rgba(250, 204, 21, .5); border-radius: 14px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="600" height="800"></canvas>
    <div id="title">TIKTOK PLINKO</div>
    <div id="hud">
      <div class="panel">Điểm: <span id="score">0</span></div>
      <div class="panel"><span class="dot offline" id="statusDot"></span><span id="statusText">Đang kết nối...</span></div>
      <div class="panel">Hàng chờ: <span id="queue">0</span></div>
    </div>
    <div id="confetti"></div>
    <div id="reward" class="hidden">
      <div id="rewardInner" class="fx"></div>
      <video id="dancerVideo" muted playsinline loop style="display:none;"></video>
      <img id="dancerImg" style="display:none;" alt="" />
      <div id="rewardText"></div>
    </div>
  </div>

<script>
(function () {
  if (typeof Matter === 'undefined') {
    document.getElementById('statusText').textContent = 'Lỗi tải Matter.js';
    return;
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const queueEl = document.getElementById('queue');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const W = 600, H = 800;
  const BUCKET_COUNT = 5;
  const BUCKET_WIDTH = W / BUCKET_COUNT;
  const bucketTop = 700;

  const BUCKETS = [
    { label: 'x1', color: '#334155', text: '#cbd5e1', mult: 1 },
    { label: 'x2', color: '#1e3a5f', text: '#93c5fd', mult: 2 },
    { label: 'MẤT ĐIỂM', color: '#4a1d24', text: '#fca5a5', mult: -1 },
    { label: 'x5', color: '#3b2a12', text: '#fcd34d', mult: 5 },
    { label: 'TRÚNG THƯỞNG', color: '#4a1030', text: '#f9a8d4', mult: 20 },
  ];

  const BALL_TYPES = {
    chat:        { radius: 12, color: '#22c55e', value: 1 },
    bot:         { radius: 14, color: '#a78bfa', value: 2 },
    small_gift:  { radius: 12, color: '#22c55e', value: 1 },
    rose:        { radius: 15, color: '#f472b6', value: 3 },
    medium_gift: { radius: 18, color: '#fb923c', value: 8 },
    heart_gift:  { radius: 21, color: '#f87171', value: 5 },
    large_gift:  { radius: 26, color: '#38bdf8', value: 15 },
    mega_gift:   { radius: 30, color: '#facc15', value: 50 },
  };

  const { Engine, Bodies, Body, Composite } = Matter;
  const engine = Engine.create();
  engine.gravity.y = 1.15;

  const balls = [];
  const popups = [];

  const rewardEl = document.getElementById('reward');
  const rewardInner = document.getElementById('rewardInner');
  const rewardTextEl = document.getElementById('rewardText');
  const dancerVideo = document.getElementById('dancerVideo');
  const dancerImg = document.getElementById('dancerImg');
  const confettiEl = document.getElementById('confetti');

  const REWARDS = [
    { emoji: '⭐', size: 80,  cls: 'pop',    life: 900,  text: 'x1' },
    { emoji: '🎉', size: 110, cls: 'bounce', life: 1300, text: 'x2' },
    { emoji: '💩', size: 110, cls: 'shake',  life: 1600, text: 'MẤT ĐIỂM' },
    { emoji: '🎆', size: 110, cls: 'bounce', life: 1300, text: 'x5' },
    { emoji: '💃', size: 170, cls: 'dance',  life: 2800, text: 'TRÚNG THƯỞNG!' },
  ];

  let dancerUrl = null;
  if (location.protocol.indexOf('http') === 0) {
    ['girl.mp4', 'girl.webm', 'girl.gif'].forEach((f) => {
      fetch(f, { method: 'HEAD' })
        .then((r) => { if (r.ok && !dancerUrl) dancerUrl = f; })
        .catch(() => {});
    });
  }

  let rewardTimer = null;
  function showReward(idx) {
    clearTimeout(rewardTimer);
    const r = REWARDS[idx];
    const isJackpot = idx === 4;
    dancerVideo.style.display = 'none';
    dancerImg.style.display = 'none';
    rewardInner.style.display = '';
    if (isJackpot && dancerUrl) {
      rewardInner.style.display = 'none';
      if (dancerUrl.indexOf('.gif') > -1) {
        dancerImg.src = dancerUrl;
        dancerImg.style.display = '';
      } else {
        dancerVideo.src = dancerUrl;
        dancerVideo.style.display = '';
        dancerVideo.play().catch(() => {});
      }
    } else {
      rewardInner.textContent = r.emoji;
      rewardInner.style.fontSize = r.size + 'px';
      rewardInner.className = 'fx ' + r.cls;
    }
    rewardTextEl.textContent = r.text;
    rewardEl.classList.remove('hidden');
    if (isJackpot) showConfetti();
    rewardTimer = setTimeout(() => rewardEl.classList.add('hidden'), r.life);
  }

  function showConfetti() {
    confettiEl.innerHTML = '';
    const colors = ['#facc15', '#f87171', '#38bdf8', '#4ade80', '#c084fc', '#fb923c'];
    for (let i = 0; i < 55; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      s.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
      confettiEl.appendChild(s);
    }
    setTimeout(() => { confettiEl.innerHTML = ''; }, 2800);
  }

  const wallOpts = { isStatic: true, restitution: 0.4, friction: 0.2 };
  Composite.add(engine.world, [
    Bodies.rectangle(0, H / 2, 20, H, wallOpts),
    Bodies.rectangle(W, H / 2, 20, H, wallOpts),
    Bodies.rectangle(W / 2, H + 20, W, 40, wallOpts),
  ]);

  const PIN_SPACING = 48;
  const ROW_GAP = 46;
  const PIN_ROWS = 12;
  const START_X = 36;
  const START_Y = 95;
  const pinOpts = { isStatic: true, restitution: 0.6, friction: 0.05, frictionStatic: 0, label: 'pin' };
  const pins = [];
  for (let row = 0; row < PIN_ROWS; row++) {
    const offset = row % 2 === 0 ? 0 : PIN_SPACING / 2;
    const y = START_Y + row * ROW_GAP;
    const maxCol = row % 2 === 0 ? 11 : 10;
    for (let col = 0; col <= maxCol; col++) {
      pins.push(Bodies.circle(START_X + offset + col * PIN_SPACING, y, 4, pinOpts));
    }
  }
  Composite.add(engine.world, pins);

  for (let i = 1; i < BUCKET_COUNT; i++) {
    Composite.add(engine.world, Bodies.rectangle(i * BUCKET_WIDTH, (bucketTop + H) / 2, 6, H - bucketTop, wallOpts));
  }

  let score = 0;

  function setScore(delta) {
    score = Math.max(0, score + delta);
    scoreEl.textContent = score.toLocaleString('vi-VN');
  }

  function removeBall(body) {
    const idx = balls.indexOf(body);
    if (idx >= 0) balls.splice(idx, 1);
    if (body) Composite.remove(engine.world, body);
  }

  function settleBall(body) {
    const bucketIdx = Math.min(4, Math.max(0, Math.floor(body.position.x / BUCKET_WIDTH)));
    const bucket = BUCKETS[bucketIdx];
    const val = body.plugin.value;
    const gain = bucket.mult === -1 ? -val : val * bucket.mult;
    setScore(gain);
    popups.push({
      x: body.position.x,
      y: bucketTop - 26,
      text: (gain < 0 ? '-' : '+') + Math.abs(gain) + (bucket.mult === 20 ? ' JACKPOT!' : ''),
      color: gain < 0 ? '#f87171' : '#facc15',
      life: 100,
    });
    showReward(bucketIdx);
    Body.setStatic(body, true);
    setTimeout(() => removeBall(body), 1600);
  }

  function spawnBall(playerName, type) {
    const cfg = BALL_TYPES[type] || BALL_TYPES.small_gift;
    const x = 150 + Math.random() * 300;
    const body = Bodies.circle(x, -20 - Math.random() * 30, cfg.radius, {
      restitution: 0.7,
      friction: 0.01,
      frictionStatic: 0,
      frictionAir: 0.0005,
      density: 0.002,
      label: 'ball',
    });
    body.plugin = { playerName, type, value: cfg.value, age: 0, stuck: 0, settled: false };
    Body.setVelocity(body, { x: (Math.random() - 0.5) * 2.5, y: 0 });
    balls.push(body);
    Composite.add(engine.world, body);
  }

  const queue = [];
  function enqueue(item) {
    queue.push(item);
    queueEl.textContent = queue.length;
  }
  setInterval(() => {
    if (queue.length > 0) {
      const item = queue.shift();
      spawnBall(item.playerName, item.type);
      queueEl.textContent = queue.length;
    }
  }, 180);

  function shade(hex, percent) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + percent));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + percent));
    const b = Math.max(0, Math.min(255, (n & 0xff) + percent));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b1220');
    bg.addColorStop(1, '#111827');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < BUCKETS.length; i++) {
      const b = BUCKETS[i];
      const x0 = i * BUCKET_WIDTH;
      ctx.fillStyle = b.color;
      ctx.fillRect(x0, bucketTop, BUCKET_WIDTH, H - bucketTop);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x0 + 0.5, bucketTop + 0.5, BUCKET_WIDTH, H - bucketTop);
      ctx.fillStyle = b.text;
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(b.label, x0 + BUCKET_WIDTH / 2, bucketTop + 24);
    }

    for (const pin of pins) {
      const { x, y } = pin.position;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#cbd5e1';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x - 1, y - 1, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
    }

    for (const body of balls) {
      const { x, y } = body.position;
      const r = body.circleRadius;
      const cfg = BALL_TYPES[body.plugin.type] || BALL_TYPES.small_gift;

      if (body.plugin.type === 'mega_gift') {
        ctx.beginPath();
        ctx.arc(x, y, r + 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(250, 204, 21, 0.22)';
        ctx.fill();
      }

      const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, cfg.color);
      grad.addColorStop(1, shade(cfg.color, -40));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.stroke();

      const name = body.plugin.playerName || '?';
      const label = name.length > 14 ? name.slice(0, 14) + '…' : name;
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(label, x, y - r - 6);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText(label, x, y - r - 6);
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.8;
      p.life--;
      ctx.globalAlpha = Math.max(0, p.life / 100);
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
      if (p.life <= 0) popups.splice(i, 1);
    }

    ctx.textAlign = 'left';
  }

  let lastTime = 0;
  function loop(now) {
    const dt = Math.min(now - lastTime, 33) || 16;
    lastTime = now;
    Engine.update(engine, dt);

    for (const body of balls) {
      const { x, y } = body.position;
      if (body.plugin.settled) continue;
      const speed = Math.hypot(body.velocity.x, body.velocity.y);
      body.plugin.age += dt;
      if (y > bucketTop - 10 && speed < 1.0) {
        settleBall(body);
      } else if (body.plugin.age > 60000) {
        removeBall(body);
      } else if (y < bucketTop - 10) {
        if (speed < 0.3) {
          body.plugin.stuck += dt;
          if (body.plugin.stuck > 500) {
            Body.setVelocity(body, {
              x: (Math.random() - 0.5) * 4,
              y: body.velocity.y - 1,
            });
            body.plugin.stuck = 0;
          }
        } else {
          body.plugin.stuck = 0;
        }
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  function setStatus(online) {
    statusDot.className = 'dot ' + (online ? 'online' : 'offline');
    statusText.textContent = online ? 'Đã kết nối' : 'Ngắt kết nối';
  }

  function connect() {
    const WS_URL = location.protocol.indexOf('http') === 0
      ? 'ws://' + location.host
      : 'ws://localhost:8080';
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus(true);
    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch (err) { return; }
      if (BALL_TYPES[msg.type]) {
        enqueue({ playerName: msg.playerName || 'khách', type: msg.type });
      }
    };
    ws.onclose = () => {
      setStatus(false);
      setTimeout(connect, 3000);
    };
    ws.onerror = () => { ws.close(); };
  }

  connect();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
